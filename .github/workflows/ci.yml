name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API (lint + test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: saag
          POSTGRES_PASSWORD: saag
          POSTGRES_DB: saag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U saag -d saag"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Stand-in configuration management database, so the SQL adapter is
      # exercised against a real server rather than only a double.
      cmdb:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: saag-root
          MYSQL_DATABASE: cmdb
          MYSQL_USER: saag
          MYSQL_PASSWORD: saag
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u saag -psaag"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://saag:saag@localhost:5432/saag
      STANDIN_CMDB_URL: mysql+pymysql://saag:saag@127.0.0.1:3306/cmdb
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install .

      # Service containers cannot mount the init scripts, so the stand-in
      # database is loaded here instead.
      - name: Seed the stand-in configuration management database
        run: |
          mysql -h 127.0.0.1 -u saag -psaag cmdb < tests/standins/cmdb/01-schema.sql
          mysql -h 127.0.0.1 -u saag -psaag cmdb < tests/standins/cmdb/02-seed.sql

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        run: pytest

  web:
    name: Web (lint + build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Test (playwright)
        run: npm run test:e2e

  docker:
    name: Docker (compose build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build production images
        run: docker compose build

      - name: Build dev images
        run: docker compose -f compose.dev.yaml build
