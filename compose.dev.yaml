services:
  api:
    build:
      context: .
      target: dev
    image: saag-api:dev
    container_name: saag-api-dev
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PYTHONPATH: /app
      LDAP_SERVICE_PASSWORD: saag-standin-admin
      MSD_SOURCE_SEED_FILE: /app/tests/standins/sources.json
    ports:
      - "8000:8000"
    volumes:
      - msd-workspace-dev:/var/lib/saag/workspace
      - .:/app
      - ./tests/standins/ansible:/etc/saag/ansible:ro

  worker:
    build:
      context: .
      target: dev
    image: saag-api:dev
    container_name: saag-worker-dev
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PYTHONPATH: /app
      LDAP_SERVICE_PASSWORD: saag-standin-admin
      MSD_SOURCE_SEED_FILE: /app/tests/standins/sources.json
    volumes:
      - msd-workspace-dev:/var/lib/saag/workspace
      - .:/app
      - ./tests/standins/ansible:/etc/saag/ansible:ro
    command: ["procrastinate", "--app=vae.operations_panel.worker.app", "worker"]

  postgres:
    image: postgres:16-alpine
    container_name: saag-postgres-dev
    env_file:
      - .env
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-saag} -d ${POSTGRES_DB:-saag}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data-dev:/var/lib/postgresql/data

  # Stand-in external systems used only in dev.
  cmdb:
    image: mysql:8
    container_name: saag-cmdb-dev
    environment:
      MYSQL_ROOT_PASSWORD: saag-root
      MYSQL_DATABASE: cmdb
      MYSQL_USER: saag
      MYSQL_PASSWORD: saag
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u saag -p$$MYSQL_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - cmdb-data-dev:/var/lib/mysql
      - ./tests/standins/cmdb:/docker-entrypoint-initdb.d:ro

  gitea:
    image: gitea/gitea:1.22
    container_name: saag-gitea-dev
    environment:
      GITEA__database__DB_TYPE: sqlite3
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__service__DISABLE_REGISTRATION: "false"
      GITEA__server__ROOT_URL: http://gitea:3000/
    ports:
      - "3002:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:3000/api/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - gitea-data-dev:/data

  gitea-seed:
    image: alpine/git:latest
    container_name: saag-gitea-seed-dev
    depends_on:
      gitea:
        condition: service_healthy
    environment:
      GITEA_URL: http://gitea:3000
      GITEA_ADMIN_USER: saag
      GITEA_ADMIN_PASSWORD: saag-standin-password
    volumes:
      - ./tests/standins:/standins
    entrypoint: ["/bin/sh", "-c", "apk add --no-cache curl >/dev/null && sh /standins/git/seed.sh"]

  openldap:
    image: osixia/openldap:1.5.0
    container_name: saag-openldap-dev
    environment:
      LDAP_ORGANISATION: SaaG stand-in
      LDAP_DOMAIN: saag.local
      LDAP_ADMIN_PASSWORD: saag-standin-admin
    ports:
      - "389:389"
    volumes:
      - ./tests/standins/ldap:/container/service/slapd/assets/config/bootstrap/ldif/custom:ro
    command: ["--copy-service"]

  package-registry:
    build:
      context: .
      target: dev
    image: saag-api:dev
    container_name: saag-package-registry-dev
    environment:
      PYTHONPATH: /app
      PACKAGE_REGISTRY_ARTIFACTS: /app/tests/standins/package_registry/artifacts.json
      PACKAGE_REGISTRY_TOKEN: standin-registry-token
    ports:
      - "8100:8100"
    volumes:
      - .:/app
    command: ["uvicorn", "tests.standins.package_registry.app:app", "--host", "0.0.0.0", "--port", "8100"]

  web:
    build:
      context: ./web
      target: dev
    image: saag-web:dev
    container_name: saag-web-dev
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - ./web:/app
      - /app/node_modules

volumes:
  msd-workspace-dev:
  postgres-data-dev:
  cmdb-data-dev:
  gitea-data-dev:
