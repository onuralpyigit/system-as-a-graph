[config_mgmt_db]
source_name = mysql
access_method = mysql
connection_address = localhost:3306/cmdb

[source_code_repo]
source_name = gitea
access_method = git
connection_address = http://localhost:3000/dsm-src

[api]
host = 127.0.0.1
port = 8080
secret_key = dev-insecure-change-me
session_lifetime = 86400

[worker]
broker_url = redis://localhost:6379/0
result_backend = redis://localhost:6379/1

[redis]
container = dsm-redis
image = redis:8.4
port = 6379
