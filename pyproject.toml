[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "system-as-a-graph"
version = "0.1.0"
requires-python = ">=3.11"
# Shared dependencies for all CSCs (msd, scg, frd, adp, csm, vae) and shared/.
dependencies = [
    "fastapi",
    "uvicorn",
    "httpx2",
    "sqlalchemy",
    "psycopg[binary]",
    "pyjwt",
    "procrastinate",
    "pymysql",
    "ldap3",
    "pyyaml",
    "cryptography",
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["."]

# Rule files ship with the package: an air-gapped deployment edits them
# in place instead of rebuilding the image.
[tool.setuptools.package-data]
msd = ["src/adapters/*.json"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency injection idiom is a call in the parameter default;
# there is no non-call form of it.
"*/api/routes.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests", "msd", "scg", "frd", "adp", "csm", "vae"]
